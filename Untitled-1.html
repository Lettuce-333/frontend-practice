    <h2>2. HTML 实体符号应用</h2>
    <p>以下是常用的 HTML 实体符号写法：</p >

    <ul>
        <li><strong>空格：</strong> 使用 &amp;nbsp; 表示 (显示效果：A&nbsp;&nbsp;&nbsp;B)</li>
        <li><strong>版权符号：</strong> 使用 &amp;copy; 表示 (显示效果：&copy; 2023 My Company)</li>
        <li><strong>注册商标：</strong> 使用 &amp;reg; 表示 (显示效果：Brand&reg;)</li>
        <li><strong>小于号：</strong> 使用 &amp;lt; 表示 (显示效果：1 &lt; 2)</li>
    </ul>
